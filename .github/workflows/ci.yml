name: CI - Test Render Deploy

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test-render-deploy:
    name: Test build, db push, and seed
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/test
      NODE_ENV: test

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm run prisma:generate

      - name: Build app
        run: pnpm build

      - name: Push schema to test database
        run: pnpm run db:push

      - name: Seed test database
        run: pnpm run db:seed

      - name: Lint
        run: pnpm lint

      - name: Run tests
        run: pnpm test

  validate-render-blueprint:
    name: Validate render.yaml
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Render CLI
        run: curl -fsSL https://raw.githubusercontent.com/render-oss/cli/refs/heads/main/bin/install.sh | sh

      - name: Add Render CLI to PATH
        run: echo "$HOME/.render/bin" >> $GITHUB_PATH

      - name: Validate render.yaml
        run: render blueprints validate render.yaml --workspace "${{ secrets.RENDER_WORKSPACE_ID }}"
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
