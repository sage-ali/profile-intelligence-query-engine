name: Keep Alive Render

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Service
        run: |
          echo "Keep-alive active. Pinging service..."
          curl -s https://intelligence-profile-bpjl.onrender.com/health
          sleep $(( RANDOM % 51 + 10 ))
          curl -s https://intelligence-profile-bpjl.onrender.com/
