databases:
  - name: intelligence-profile-db
    plan: free
    region: oregon
    ipAllowList: []

services:
  - name: intelligence-profile
    type: web
    runtime: node
    region: oregon
    plan: free
    autoDeploy: true
    healthCheckPath: /health

    buildCommand: pnpm install --frozen-lockfile && pnpm build
    preDeployCommand: pnpm run db:push && pnpm run db:seed
    startCommand: node dist/src/main.js

    envVars:
      - key: PORT
        value: '3000'

      - key: NODE_VERSION
        value: '20.x'

      - key: DATABASE_URL
        fromDatabase:
          name: intelligence-profile-db
          property: connectionString
