databases:
  - name: intelligence-profile-db
    plan: free
    region: oregon
    ipAllowList: []

services:
  - name: intelligence-profile
    type: web
    runtime: node
    region: oregon
    buildCommand: pnpm install && pnpm build
    startCommand: node dist/src/main.js
    plan: free
    autoDeploy: true
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: '3000'
      - key: NODE_VERSION
        value: '20.x'
      - key: DATABASE_URL
        fromDatabase:
          name: intelligence-profile-db
          property: connectionString
